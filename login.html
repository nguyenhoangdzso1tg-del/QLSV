<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập hệ thống</title>
<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e40af">
<script src="theme-init.js"></script>
</head>

<body>

<button type="button" class="theme-toggle" id="themeToggle" title="Đổi giao diện sáng / tối">
  <i class="fa-solid fa-moon"></i>
</button>

<div class="auth-shell">
  <div class="login-container">

    <div class="brand">
      <i class="fa-solid fa-shield-halved"></i>
    </div>

    <h1>Hệ thống quản lý vi phạm</h1>

    <!-- ===== CHƯA ĐĂNG NHẬP ===== -->
    <div id="loginView">
      <p class="sub">Đăng nhập bằng tài khoản Google để tiếp tục</p>

      <button type="button" class="google-btn" id="googleBtn">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.9z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.4-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.7-.4-3.9z"/>
        </svg>
        Đăng nhập bằng Google
      </button>

      <p class="note">
        Lần đầu đăng nhập, tài khoản sẽ ở trạng thái <b>chờ admin duyệt</b>.<br>
        Admin sẽ gán <b>cơ sở</b> và <b>vai trò</b> cho bạn.
      </p>
    </div>

    <!-- ===== ĐÃ ĐĂNG NHẬP NHƯNG CHƯA ĐƯỢC DUYỆT ===== -->
    <div id="pendingView" class="hidden">
      <div class="pending-avatar">
        <img id="pendingAvatar" alt="Avatar">
      </div>
      <h2 id="pendingName">…</h2>
      <p id="pendingEmail">…</p>
      <div id="pendingStatus" class="status-pill pending">
        <i class="fa-solid fa-hourglass-half"></i> Chờ admin duyệt
      </div>
      <p id="pendingMsg" class="note">
        Bạn đã đăng nhập thành công. Vui lòng chờ admin duyệt tài khoản và gán cơ sở.
      </p>
      <div class="row">
        <button type="button" id="refreshBtn">
          <i class="fa-solid fa-rotate"></i> Kiểm tra lại
        </button>
        <button type="button" id="logoutBtn" class="ghost">
          <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
        </button>
      </div>
    </div>

    <div id="msg" class="msg"></div>
  </div>

  <p class="credit">Nguyen Hoang THUD3 9+K5</p>
</div>

<script type="module" src="auth.js"></script>

<!-- PWA: đăng ký service worker (cài app / mở nhanh) -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(function () {});
}
</script>

</body>
</html>
